server.port=${PORT:8080}
spring.application.name=ecommerce
spring.config.import=optional:file:.env.local[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.default_batch_fetch_size=100

jwt.secret=${SUPABASE_JWT_SECRET}
supabase.jwk-set-uri=${SUPABASE_JWK_SET_URI:https://irqqmxphmbnomzsbozxr.supabase.co/auth/v1/.well-known/jwks.json}
supabase.issuer-uri=${SUPABASE_ISSUER_URI:https://irqqmxphmbnomzsbozxr.supabase.co/auth/v1}